name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This plugin is deliberately NOT self-contained: `tsconfig.json` extends the
# sibling harness checkout, and the unit suite resolves the vendored cordis and
# cosmokit SOURCES from it. CI therefore provides a bare `git clone` of the
# harness release the devDependencies/peerDependencies pin — no install and no
# build, which is all `tsconfig.base.json` + `vendor/*/src` amount to.
# Bump HARNESS_TAG in the same change as those version ranges.
env:
  HARNESS_TAG: dsh-v0.2.1-rc.1

jobs:
  gates:
    # Windows on purpose. `src/cli-setup.ts` branches on `process.platform`, and
    # the coverage gate cannot be satisfied where the win32 arm is unreachable.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Full history: `scripts/coverage-gate.mjs` diffs this commit against its
      # base to decide which files the branch TOUCHES, and those are the ones
      # held to 100%. A depth-1 checkout has no base to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A sibling of the checkout, because that is the path both `tsconfig.json`
      # (`../deepseek-harness/tsconfig.base.json`) and `vitest.config.ts`
      # (`../deepseek-harness/vendor/...`) resolve against.
      - name: Check out the harness release this build targets
        shell: bash
        run: |
          git clone --depth 1 --branch "$HARNESS_TAG" \
            https://github.com/deepseek-ai/deepseek-harness.git ../deepseek-harness

      # Reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .compat/015/pnpm-lock.yaml
            .compat/017/pnpm-lock.yaml
            .compat/020/pnpm-lock.yaml
            .compat/021/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run build

      # `test:coverage` = `vitest run --coverage && node scripts/coverage-gate.mjs`.
      # The gate holds the files THIS BRANCH touches to 100% per file and the
      # rest to the committed floor in `.coverage-baseline.json`; it needs the
      # base commit to know which is which. Both expressions below are SHAs, so
      # the gate never has to guess a branch name.
      - name: Coverage gate (touched files at 100%, no regressions elsewhere)
        shell: bash
        env:
          # A push carries the previous tip of the branch (`0000…` for a new
          # one); a pull request carries the commit it targets.
          COVERAGE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$COVERAGE_BASE_REF" ] || [[ "$COVERAGE_BASE_REF" =~ ^0+$ ]]; then
            echo "no usable base commit; gating against HEAD~1"
            unset COVERAGE_BASE_REF
          fi
          pnpm run test:coverage

      # One build serves four harness lines, and each `.compat/0NN` set is its
      # own install root with an untracked `node_modules`, so these install
      # separately from the root workspace.
      - run: pnpm run compat:install
      - run: pnpm run test:compat
